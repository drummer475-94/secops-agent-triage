[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secops-agent-triage"
version = "0.1.0"
description = "Flagship AI Agentic Security Triage Workflow with MCP Support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
secops-triage = "secops_agent_triage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["secops_agent_triage"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
